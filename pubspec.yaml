name: city_solutions
description: A multi-module city services Flutter app foundation.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0
  firebase_app_check: ^0.4.6
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
